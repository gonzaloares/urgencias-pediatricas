name: Check content integrity

on:
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs/**/*.md"
      - "docs/data/*.json"
      - "docs/javascripts/*.js"
      - "scripts/check_alphabetical_order.py"
      - "scripts/check_drug_registry.py"
      - "scripts/check_infusion_registry.py"
      - "scripts/check_rsi_registry.py"
      - "scripts/check_markdown_rendering.py"
      - "scripts/generate_pwa_assets.py"
      - "scripts/generate_offline_static_urls.py"
      - "scripts/service-worker.template.js"
      - ".github/workflows/check-alphabetical-order.yml"
  push:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "docs/**/*.md"
      - "docs/data/*.json"
      - "docs/javascripts/*.js"
      - "scripts/check_alphabetical_order.py"
      - "scripts/check_drug_registry.py"
      - "scripts/check_infusion_registry.py"
      - "scripts/check_rsi_registry.py"
      - "scripts/check_markdown_rendering.py"
      - "scripts/generate_pwa_assets.py"
      - "scripts/generate_offline_static_urls.py"
      - "scripts/service-worker.template.js"
      - ".github/workflows/check-alphabetical-order.yml"

permissions:
  contents: read

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Check alphabetical order
        run: python scripts/check_alphabetical_order.py

      - name: Check Markdown rendering safety
        run: python scripts/check_markdown_rendering.py

      - name: Check drug registry
        run: python scripts/check_drug_registry.py

      - name: Check drug calculator JavaScript syntax
        run: node --check docs/javascripts/dose-calculator.js

      - name: Check infusion registry
        run: python scripts/check_infusion_registry.py

      - name: Check infusion calculator JavaScript syntax
        run: node --check docs/javascripts/infusion-calculator.js

      - name: Check RSI registry
        run: python scripts/check_rsi_registry.py

      - name: Check PWA JavaScript syntax
        run: |
          node --check docs/javascripts/pwa.js
          node --check scripts/service-worker.template.js

      - name: Check PWA Python syntax
        run: |
          python -m py_compile scripts/generate_pwa_assets.py
          python -m py_compile scripts/generate_offline_static_urls.py

      - name: Smoke test generated PWA assets
        run: |
          python scripts/generate_pwa_assets.py ci-test-build
          node --check docs/service-worker.js
          python -m json.tool docs/build-info.json > /dev/null
          mkdir -p /tmp/pwa-site/search /tmp/pwa-site/assets/javascripts/workers
          printf '{}' > /tmp/pwa-site/search/search_index.json
          printf 'self.onmessage=()=>{};' > /tmp/pwa-site/assets/javascripts/workers/search.test.js
          python scripts/generate_offline_static_urls.py /tmp/pwa-site
          python -m json.tool /tmp/pwa-site/offline-static-urls.json > /dev/null
