name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check alphabetical order
        run: python scripts/check_alphabetical_order.py

      - name: Generate PWA assets
        run: python scripts/generate_pwa_assets.py "${GITHUB_SHA}"

      - name: Validate PWA assets
        run: |
          python -m json.tool docs/manifest.webmanifest > /dev/null
          test -f docs/assets/icons/icon-192.png
          test -f docs/assets/icons/icon-512.png
          test -f docs/assets/icons/apple-touch-icon.png
          test -f docs/offline-urls.json
          node --check docs/service-worker.js

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
