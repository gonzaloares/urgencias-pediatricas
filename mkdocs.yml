  - O.R.L.:
      - orl/index.md
      - Faringoamigdalitis aguda: infeccioso/faringoamigdalitis-aguda.md
      - Infección respiratoria de vías altas: respiratorio/infeccion-respiratoria-vias-altas.md
      - Laringitis aguda: respiratorio/laringitis-aguda.md
      - Otitis media aguda: infeccioso/otitis-media-aguda.md
  - Procedimientos y soporte:
      - procedimientos/index.md
      - Aproximación y estabilización inicial · TEP y ABCDE: emergencias/estabilizacion-inicial-tep-abcde.md
      - Manejo del dolor: procedimientos/manejo-dolor.md
      - Reanimación cardiopulmonar: procedimientos/reanimacion-cardiopulmonar.md
      - Sedoanalgesia: procedimientos/sedoanalgesia.md
