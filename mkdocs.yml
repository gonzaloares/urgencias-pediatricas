      - Bronquiolitis aguda: respiratorio/bronquiolitis-aguda.md
      - Crisis asmática: respiratorio/crisis-asmatica.md
      - Neumonía adquirida en la comunidad: respiratorio/neumonia-adquirida-comunidad.md

plugins:
  - search:
      lang: es

markdown_extensions:
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js
  - javascripts/pwa.js

strict: true
