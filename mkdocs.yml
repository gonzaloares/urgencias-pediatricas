site_name: Urgencias Pediátricas
site_description: Protocolos prácticos de Urgencias Pediátricas
theme:
  name: material
  language: es
  custom_dir: docs/overrides
  favicon: assets/icons/icon-192.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
  palette:
    primary: teal
    accent: cyan

nav:
  - Inicio: index.md
  - Accidentes:
      - trauma/index.md
      - Cuerpo extraño ocular: trauma/cuerpo-extrano-ocular.md
      - Hipotermia y golpe de calor: trauma/hipotermia-golpe-calor.md
      - Ingesta y aspiración de cuerpo extraño: procedimientos/ingesta-aspiracion-cuerpo-extrano.md
      - Intoxicaciones: toxicologia/intoxicaciones.md
      - Lesiones por electricidad: trauma/lesiones-electricidad.md
      - Lesiones por inmersión: trauma/lesiones-inmersion.md
      - Mordeduras y picaduras: trauma/mordeduras-picaduras.md
      - Paciente politraumatizado: trauma/politraumatizado.md
      - Traumatismo craneoencefálico: trauma/traumatismo-craneoencefalico.md
      - Traumatismo periférico: trauma/traumatismo-periferico.md
  - Cardiovascular:
      - cardiologia/index.md
      - Arritmias: cardiologia/arritmias.md
      - Crisis hipertensiva: cardiologia/crisis-hipertensiva.md
      - Dolor torácico: cardiologia/dolor-toracico.md
      - Enfermedad de Kawasaki: cardiologia/enfermedad-kawasaki.md
      - Shock: emergencias/shock.md
  - Dermatología:
      - dermatologia/index.md
      - Anafilaxia: alergia/anafilaxia.md
      - Quemaduras: trauma/quemaduras.md
      - Urticaria y angioedema: dermatologia/urticaria-angioedema.md
  - Digestivo:
      - digestivo/index.md
      - Dolor abdominal agudo: digestivo/dolor-abdominal-agudo.md
      - Estreñimiento: digestivo/estrenimiento.md
      - Gastroenteritis aguda y deshidratación: digestivo/gastroenteritis-aguda-deshidratacion.md
  - Endocrino-metabólico:
      - endocrino/index.md
      - Cetoacidosis diabética: endocrino/cetoacidosis-diabetica.md
      - Hipoglucemia: endocrino/hipoglucemia.md
  - Genito-urinario-renal:
      - nefrologia/index.md
      - Cólico nefrítico y litiasis urinaria: nefrologia/colico-nefritico.md
      - Infección del tracto urinario: infeccioso/infeccion-tracto-urinario.md
      - Síndrome nefrítico agudo: nefrologia/sindrome-nefritico.md
      - Síndrome nefrótico: nefrologia/sindrome-nefrotico.md
  - Hematología:
      - sangre/index.md
      - Síndrome de lisis tumoral: sangre/sindrome-lisis-tumoral.md
      - Trombocitopenia inmune primaria: sangre/trombocitopenia-inmune-primaria.md
  - Infecciosa:
