      - Sepsis: infeccioso/sepsis.md
  - Locomotor:
      - locomotor/index.md
      - Cojera aguda: locomotor/cojera-aguda.md
  - Miscelánea:
      - inespecifica/index.md
      - Agresión sexual en la infancia y adolescencia: proteccion-infancia/agresion-sexual.md
      - Maltrato físico en la infancia: proteccion-infancia/maltrato-fisico.md
      - Principales urgencias psiquiátricas: salud-mental/urgencias-psiquiatricas.md
  - Neurológico:
      - neurologia/index.md
      - Ataxia aguda: neurologia/ataxia-aguda.md
      - Cefalea: neurologia/cefalea.md
      - Coma: neurologia/coma.md
      - Convulsión febril: neurologia/convulsion-febril.md
      - Estatus epiléptico: neurologia/estatus-epileptico.md
      - Hipertensión intracraneal: neurologia/hipertension-intracraneal.md
